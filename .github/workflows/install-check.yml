name: Install Check

# Deliberately separate from python-ci.yml. That workflow answers "do the tests
# pass", which it does by importing the source tree. This one answers a
# different question: if a stranger follows the README on a machine that has
# nothing, do they end up with something that runs?
#
# Those fail independently. pip writes a console-script launcher for
# `foo = pkg.cli:main` without ever checking that `pkg.cli` exists, so a repo
# can have a green test suite and a command that dies the first time anyone
# types its name. That exact bug shipped in this portfolio.
#
# This is also the only place Windows and macOS get exercised.
#
# Private repositories that run CI on self-hosted runners set the repository
# variable CI_RUNS_ON to a scale-set name. Those runners are Linux pods, so for
# push and pull-request runs this workflow then installs on that runner only.
# GitHub-hosted macOS and Windows runners still cost Actions minutes, so the full
# `operating-systems` matrix runs on workflow_dispatch and schedule events only.
# A repository that also supports Windows sets CI_RUNS_ON_WINDOWS to the name of its
# Windows runner scale set, and push and pull-request runs then add that one Windows leg
# (a disposable VM per job). Deleting CI_RUNS_ON restores the full matrix on every run.
# Public repositories never set either variable.
#
# Usage from a calling repo:
#
#   jobs:
#     install-check:
#       uses: casonk/.github/.github/workflows/install-check.yml@main

on:
  workflow_call:
    inputs:
      python-versions:
        description: >-
          JSON array of Python versions to test against, or `auto-edges` for the declared
          requires-python floor plus the newest supported CPython, or `auto` for the newest
          `python-count` supported minors.
        type: string
        default: '["3.11", "3.12"]'
      python-count:
        description: 'How many versions `auto` resolves to'
        type: string
        default: '3'
      operating-systems:
        description: 'JSON array of runner labels to install on'
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      install-extra:
        description: 'pyproject.toml extra to install, e.g. "dev". Empty installs bare.'
        type: string
        default: ''
      run-pytest:
        description: 'Run pytest after verifying the install'
        type: boolean
        default: false
      shared-ref:
        description: 'Ref of casonk/.github to take scripts/verify_install.py from'
        type: string
        default: 'main'

permissions:
  contents: read

jobs:
  python-versions:
    # Turns the python-versions input into a concrete JSON array. A JSON array passes through; `auto`
    # (newest N supported CPython minors) and `auto-edges` (declared floor + newest) are resolved
    # from endoflife.date and the caller's requires-python, so no repo hard-codes a version list.
    runs-on: ${{ vars.CI_RUNS_ON != '' && vars.CI_RUNS_ON || 'ubuntu-latest' }}
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: casonk/.github
          ref: ${{ inputs.shared-ref }}
          path: .ci-shared
          sparse-checkout: scripts
      - id: resolve
        env:
          SPEC: ${{ inputs.python-versions }}
          COUNT: ${{ inputs.python-count }}
        run: python3 .ci-shared/scripts/resolve_python_versions.py --spec "$SPEC" --count "$COUNT" --github-output "$GITHUB_OUTPUT"

  install:
    needs: python-versions
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(vars.CI_RUNS_ON != '' && github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && (vars.CI_RUNS_ON_WINDOWS != '' && format('["{0}","{1}"]', vars.CI_RUNS_ON, vars.CI_RUNS_ON_WINDOWS) || format('["{0}"]', vars.CI_RUNS_ON)) || inputs.operating-systems) }}
        python-version: ${{ fromJson(needs.python-versions.outputs.versions) }}

    steps:
      - uses: actions/checkout@v7

      # Fetched by checkout rather than curl so the verifier is pinned to a ref
      # and works for private callers, where a raw.githubusercontent URL is not
      # readable.
      - name: Check out shared scripts
        uses: actions/checkout@v7
        with:
          repository: casonk/.github
          ref: ${{ inputs.shared-ref }}
          path: .ci-shared
          sparse-checkout: scripts

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # A build artifact committed by accident would let a broken install look
      # healthy here exactly as it does on a developer's machine.
      - name: Remove stale build artifacts
        shell: python
        run: |
          import pathlib, shutil
          for pattern in ("build", "dist", "*.egg-info", "src/*.egg-info", ".venv"):
              for path in pathlib.Path(".").glob(pattern):
                  shutil.rmtree(path, ignore_errors=True)
                  print(f"removed {path}")

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ inputs.install-extra }}" ]; then
            python -m pip install -e ".[${{ inputs.install-extra }}]"
          else
            python -m pip install -e .
          fi

      - name: Verify the install actually runs
        shell: bash
        run: python .ci-shared/scripts/verify_install.py --repo .

      - name: pytest
        if: ${{ inputs.run-pytest }}
        shell: bash
        run: |
          if ! command -v pytest >/dev/null 2>&1; then
            pip install pytest
          fi
          pytest -q
