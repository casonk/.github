name: Build Python distribution

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. A private repository can point this at its self-hosted
          scale set; never use a self-hosted label for a public repository.
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
