name: Secret Scan

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: 'Gitleaks CLI version used for every scan'
        type: string
        default: '8.30.1'

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            # Sunday scans start together. The release CDN then answers some
            # of them with an HTML page, which tar reports as "not in gzip format".
            sleep "$((RANDOM % 240))"
          fi
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          for attempt in 1 2 3 4 5; do
            http_code="$(curl -sS -L --http1.1 --retry 3 --retry-all-errors --retry-delay 2 -o /tmp/gitleaks.tar.gz -w "%{http_code}" "$url" || true)"
            if [ "$http_code" = "200" ] && tar -tzf /tmp/gitleaks.tar.gz >/dev/null 2>&1; then
              tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
              exit 0
            fi
            echo "gitleaks download attempt ${attempt} failed (http ${http_code})"
            rm -f /tmp/gitleaks.tar.gz
            sleep "$((attempt * 20))"
          done
          echo "failed to download gitleaks ${GITLEAKS_VERSION}" >&2
          exit 1

      # A single full-history scan on every trigger. The previous push/pull_request
      # path used gitleaks-action@v2, which has no way to consume
      # .gitleaks-baseline.json — so accepted historical findings were re-reported
      # whenever a push range happened to include the commit that introduced them,
      # and whether CI passed depended on the shape of the push rather than on the
      # contents of the repository. Scanning --all with the baseline applied is
      # deterministic and still fails on any finding that is not already accepted.
      - name: Run Gitleaks (full history with baseline)
        run: |
          set -euo pipefail
          args=(
            detect
            --redact
            -v
            --exit-code=2
            --report-format=sarif
            --report-path=results.sarif
            --log-level=debug
            --log-opts=--all
          )
          if [ -f .gitleaks-baseline.json ]; then
            args+=(--baseline-path .gitleaks-baseline.json)
          else
            echo "No .gitleaks-baseline.json present; scanning without a baseline."
          fi
          /tmp/gitleaks "${args[@]}"

      - name: Upload Gitleaks SARIF
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-results.sarif
          path: results.sarif
